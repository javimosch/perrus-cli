# perrus-cli — JAR infrastructure monitoring
# rbm2/rbm4 require Tailscale (disabled when FortiClient VPN is active)

endpoints:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  - name: "dk1-ssh"
    group: "Infrastructure"
    url: "tcp://92.113.145.178:22"
    interval: "60s"
    conditions:
      - "[CONNECTED] == true"

  - name: "dk2-ssh"
    group: "Infrastructure"
    url: "tcp://92.113.145.16:22"
    interval: "60s"
    conditions:
      - "[CONNECTED] == true"

  - name: "dk1-traefik"
